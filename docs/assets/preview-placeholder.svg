<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="屏安符界面示意图">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0.45"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="960" height="540" rx="14" fill="url(#bg)"/>
  <!-- window chrome -->
  <rect x="24" y="24" width="912" height="492" rx="12" fill="#111827" stroke="#334155"/>
  <circle cx="52" cy="52" r="6" fill="#ef4444"/>
  <circle cx="74" cy="52" r="6" fill="#f59e0b"/>
  <circle cx="96" cy="52" r="6" fill="#22c55e"/>
  <text x="122" y="57" fill="#94a3b8" font-family="sans-serif" font-size="15">屏安符 · PrivacyGuard AI</text>
  <!-- blurred desktop behind overlay -->
  <rect x="48" y="78" width="560" height="420" rx="10" fill="#0b1220"/>
  <g filter="url(#blur)" opacity="0.8">
    <rect x="70" y="100" width="240" height="150" rx="8" fill="#2563eb"/>
    <rect x="330" y="100" width="250" height="150" rx="8" fill="#9333ea"/>
    <rect x="70" y="270" width="510" height="200" rx="8" fill="#0ea5e9"/>
  </g>
  <!-- overlay tint -->
  <rect x="48" y="78" width="560" height="420" rx="10" fill="url(#screen)"/>
  <!-- shield badge -->
  <g transform="translate(300 250)">
    <path d="M0 -46 L40 -30 V10 C40 40 0 60 0 60 C0 60 -40 40 -40 10 V-30 Z" fill="#ffffff" opacity="0.92"/>
    <path d="M-16 2 L-4 16 L20 -14" fill="none" stroke="#1d4ed8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="328" y="470" fill="#e2e8f0" font-family="sans-serif" font-size="18" text-anchor="middle">保护中 · 主人离开</text>
  <!-- settings panel -->
  <rect x="628" y="78" width="292" height="420" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="652" y="112" fill="#f8fafc" font-family="sans-serif" font-size="17" font-weight="bold">设置</text>
  <line x1="652" y1="124" x2="896" y2="124" stroke="#334155"/>
  <!-- toggle rows -->
  <g font-family="sans-serif" font-size="14" fill="#cbd5e1">
    <text x="652" y="158">保护手段一</text>
    <rect x="836" y="144" width="44" height="22" rx="11" fill="#22c55e"/>
    <circle cx="868" cy="155" r="8" fill="#fff"/>
    <text x="652" y="204">保护手段二</text>
    <rect x="836" y="190" width="44" height="22" rx="11" fill="#475569"/>
    <circle cx="848" cy="201" r="8" fill="#fff"/>
    <text x="652" y="250">效果模式</text>
    <rect x="790" y="234" width="90" height="24" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="800" y="251" font-size="12" fill="#93c5fd">真实模糊</text>
    <text x="652" y="298">触发距离</text>
    <rect x="790" y="284" width="90" height="24" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="800" y="301" font-size="12">1.5 米</text>
    <text x="652" y="346">最大暗度</text>
    <rect x="652" y="360" width="224" height="8" rx="4" fill="#0f172a"/>
    <rect x="652" y="360" width="150" height="8" rx="4" fill="#3b82f6"/>
    <text x="652" y="404">最大模糊</text>
    <rect x="652" y="418" width="224" height="8" rx="4" fill="#0f172a"/>
    <rect x="652" y="418" width="180" height="8" rx="4" fill="#8b5cf6"/>
  </g>
  <text x="652" y="472" fill="#64748b" font-family="sans-serif" font-size="12">纯本地运行 · 不上传任何数据</text>
</svg>
